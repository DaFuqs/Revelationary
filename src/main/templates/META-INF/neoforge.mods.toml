# TODO: remove modLoader and loaderVersion in 1.21.6+
modLoader = "javafml"
loaderVersion = "[1,)"

license = "lGPL3"
issueTrackerURL = "https://github.com/DaFuqs/Revelationary/issues"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]]
modId = "revelationary"
version = "${mod_version}"
displayName = "Revelationary"
displayURL = "https://github.com/DaFuqs/Revelationary"
logoFile = "assets/revelationary/icon.png"
authors = "DaFuqs"
description = '''Data Driven Block and Item Revelation system. Discover as you go!'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config = "revelationary.mixins.json"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.revelationary]] #optional
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

# Here's another dependency
[[dependencies.revelationary]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"