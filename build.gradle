plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com" }
	maven { url "https://api.modrinth.com/maven/" }
	maven { url "https://maven2.bai.lol" } // WTHIT
	maven { url = "https://maven.blamejared.com" } // JEI
}

dependencies {
	// fabric
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// dependencies
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// mod compat
	//	compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	compileOnly "maven.modrinth:jade:${project.jade_version}"
	// https://maven4.bai.lol/mcp/mobius/waila/
	compileOnly "mcp.mobius.waila:wthit-api:fabric-${project.wthit_version}"

	// broken dependencies
	//compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
	//runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

base {
	archivesName = project.archives_base_name
}

jar {
	from("LICENSE.md") {
		rename { "${it}_${project.archives_base_name}"}
	}
}


// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			name "sapphoCompany"
			url = "https://maven.is-immensely.gay/releases"
			credentials {
				username = "dafuqs"
				password = System.getenv("MAVEN_PASS")
			}
		}
	}
}
